name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Tsuzuri
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/tsuzuri-linux-${{ matrix.arch }}" \
            ./cmd/tsuzuri

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tsuzuri-linux-${{ matrix.arch }}
          path: dist/tsuzuri-linux-${{ matrix.arch }}
