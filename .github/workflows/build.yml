name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: linux-amd64
            goarch: amd64
          - name: termux-aarch64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Tsuzuri
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/tsuzuri-${{ matrix.name }}" \
            ./cmd/tsuzuri

      - name: Verify binary
        run: file "dist/tsuzuri-${{ matrix.name }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tsuzuri-${{ matrix.name }}
          path: dist/tsuzuri-${{ matrix.name }}
